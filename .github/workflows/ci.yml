name: GridLens CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/verify_seed.py
      - run: PYTHONPATH=. LLM_PROVIDER=mock MODEL_PROVIDER=mock pytest --cov=domain --cov=services --cov-fail-under=80 -q
      - run: python -m compileall -q domain services apps

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
